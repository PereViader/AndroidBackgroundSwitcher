name: Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version & Existing Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      tag: ${{ steps.version_info.outputs.tag }}
      is_prerelease: ${{ steps.version_info.outputs.is_prerelease }}
      release_exists: ${{ steps.check_release.outputs.release_exists }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Parse Version Properties
        id: version_info
        run: |
          if [ ! -f "version.properties" ]; then
            echo "Error: version.properties not found in repository root!" >&2
            exit 1
          fi

          RAW_VERSION=$(grep '^versionName=' version.properties | cut -d'=' -f2- | tr -d '\r\n[:space:]')
          if [ -z "$RAW_VERSION" ]; then
            echo "Error: versionName is missing in version.properties!" >&2
            exit 1
          fi

          CLEAN_VERSION="${RAW_VERSION#v}"
          TAG="v${CLEAN_VERSION}"

          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Repository encoded version: ${CLEAN_VERSION}"
          echo "Repository target tag: ${TAG}"

          if echo "$CLEAN_VERSION" | grep -iq "preview"; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Preview detected. Release will be flagged as pre-release."
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Standard release detected."
          fi

      - name: Check if Release Exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_info.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Notice: Release $TAG already exists on GitHub."
            echo "Finishing instantly with SUCCESS. Build pipeline will stop without rebuilding."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist yet. Proceeding with tests and build pipeline."
          fi

  build-and-release:
    name: Test, Build & Release
    needs: check-version
    if: needs.check-version.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Validations and Tests
        run: ./gradlew compileReleaseKotlin testDebugUnitTest

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      - name: Setup Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Using configured repository release keystore secret."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${RELEASE_KEYSTORE_PASSWORD:-android}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${RELEASE_KEY_ALIAS:-androidkey}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-android}" >> "$GITHUB_ENV"
          else
            echo "No custom release keystore secret configured. Generating automated CI signing keystore..."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -alias androidkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=AndroidBackgroundSwitcher, OU=CI, O=PereViader, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androidkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Package Release Artifact
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          OUTPUT_DIR="app/build/outputs/apk/release"
          if [ -f "$OUTPUT_DIR/app-release.apk" ]; then
            SOURCE_APK="$OUTPUT_DIR/app-release.apk"
          elif [ -f "$OUTPUT_DIR/app-release-unsigned.apk" ]; then
            SOURCE_APK="$OUTPUT_DIR/app-release-unsigned.apk"
          else
            echo "Error: Release APK not found in $OUTPUT_DIR" >&2
            exit 1
          fi

          ARTIFACT_NAME="AndroidBackgroundSwitcher-${TAG}.apk"
          cp "$SOURCE_APK" "$ARTIFACT_NAME"
          echo "RELEASE_APK_PATH=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "Prepared artifact $ARTIFACT_NAME from $SOURCE_APK"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK_PATH }}
          path: ${{ env.RELEASE_APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
          IS_PRERELEASE: ${{ needs.check-version.outputs.is_prerelease }}
          APK_FILE: ${{ env.RELEASE_APK_PATH }}
        run: |
          EXTRA_ARGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=("--prerelease")
            RELEASE_TITLE="Android Background Switcher ${TAG} (Preview)"
          else
            RELEASE_TITLE="Android Background Switcher ${TAG}"
          fi

          echo "Creating GitHub Release: $TAG ($RELEASE_TITLE)..."
          gh release create "$TAG" "$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
